<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Full colored background (no transparency) -->
  <rect width="256" height="256" fill="#0f172a" rx="0"/>
  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
  <!-- Star icon (stamp symbol) -->
  <g transform="translate(128, 128)">
    <polygon
      points="0,-65 19,-20 65,-20 28,8 40,53 0,28 -40,53 -28,8 -65,-20 -19,-20"
      fill="#ffffff"
      opacity="0.95"
    />
    <circle cx="0" cy="0" r="8" fill="url(#bg)" opacity="0.6"/>
  </g>
</svg>