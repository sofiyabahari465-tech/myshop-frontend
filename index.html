    <!-- استایل اولیه برای نمایش loader قبل از بارگذاری React -->
    <style>
      /* لودر اولیه - قبل از بارگذاری React */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      #initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .initial-loader__spinner {
        width: 64px;
        height: 64px;
        position: relative;
      }

      .initial-loader__spinner::before,
      .initial-loader__spinner::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid transparent;
      }

      .initial-loader__spinner::before {
        border-top-color: #06b6d4;
        border-right-color: #06b6d4;
        animation: initial-loader-spin 1s linear infinite;
      }

      .initial-loader__spinner::after {
        border-bottom-color: #a855f7;
        border-left-color: #a855f7;
        animation: initial-loader-spin 1.5s linear reverse infinite;
        inset: 8px;
      }

      @keyframes initial-loader-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .initial-loader__text {
        color: #e2e8f0;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.5px;
        animation: initial-loader-pulse 1.5s ease-in-out infinite;
      }

      .initial-loader__subtext {
        color: #64748b;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
      }

      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      /* فونت پیش‌فرض برای قبل از بارگذاری فونت اصلی */
      body {
        margin: 0;
        font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- لودر اولیه - قبل از بارگذاری React -->
    <div id="initial-loader">
      <div class="initial-loader__spinner"></div>
      <div class="initial-loader__text">در حال بارگذاری...</div>
      <div class="initial-loader__subtext">لطفاً چند ثانیه صبر کنید</div>
    </div>

  </body>
